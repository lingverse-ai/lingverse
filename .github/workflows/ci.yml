name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate
        run: python3 tools/validate.py
      - name: recipe is fresh
        run: python3 tools/pack.py --check
      - name: tests
        run: python3 spirits/moling/tests/run_tests.py
